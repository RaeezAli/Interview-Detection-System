<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Interview | InterviewAI</title>
    <meta
      name="description"
      content="Real-time AI interview analysis using your webcam."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  </head>
  <body>
    <nav>
      <a href="{{ url_for('index') }}" class="logo">InterviewAI</a>
      <div class="nav-links">
        <a href="{{ url_for('index') }}"><i class="fas fa-home"></i> Home</a>
      </div>
    </nav>

    <div class="live-container">
      <!-- Left: Video Feed -->
      <div class="video-column">
        <div class="video-wrapper">
          <div class="live-badge" id="live-badge">
            <div class="pulse-dot"></div>
            LIVE
          </div>
          <video id="webcam" autoplay playsinline></video>
          <div id="processingOverlay" style="
              display: none;
              position: absolute;
              top: 0; left: 0;
              width: 100%; height: 100%;
              background: rgba(0,0,0,0.8);
              border-radius: 12px;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              z-index: 10;
          ">
              <div style="
                  width: 50px; height: 50px;
                  border: 4px solid #6366f1;
                  border-top-color: transparent;
                  border-radius: 50%;
                  animation: spin 1s linear infinite;
                  margin-bottom: 15px;
              "></div>
              <p id="overlayText" style="color:#fff; font-size:1.1rem;">Preparing upload...</p>
          </div>
        </div>

        <div class="video-controls">
          <div class="timer" id="timer">00:00:00</div>
          <div class="btn-group">
            <button class="btn btn-start" id="start-btn">
              <i class="fas fa-play"></i> Start Interview
            </button>
            <button class="btn btn-end" id="end-btn" disabled>
              <i class="fas fa-stop"></i> End Interview
            </button>
          </div>
        </div>
      </div>

      <!-- Right: Stats Panel -->
      <div class="stats-column">
        <div class="stats-header">
          <h2>Live Analysis</h2>
          <i class="fas fa-microchip" style="color: var(--purple)"></i>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label"><i class="fas fa-eye"></i> Eye Contact</div>
            <div class="stat-value">
              <span id="stat-gaze">Waiting...</span>
              <span class="indicator-dot" id="dot-gaze"></span>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-label">
              <i class="fas fa-smile"></i> Expression
            </div>
            <div class="stat-value" id="stat-emotion">Waiting...</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">
              <i class="fas fa-user-tie"></i> Posture
            </div>
            <div class="stat-value" id="stat-posture">Waiting...</div>
          </div>

          <div>
            <div
              class="stat-label"
              style="justify-content: space-between; margin-bottom: 0.5rem"
            >
              <span><i class="fas fa-chart-line"></i> Confidence Score</span>
              <span id="score-text">0%</span>
            </div>
            <div class="progress-bar8">
              <div class="score-fill" id="score-fill" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <div class="tips-panel">
          <h4><i class="fas fa-lightbulb"></i> Live Tips</h4>
          <div class="tip-content" id="tip-text">
            Waiting for analysis to start...
          </div>
        </div>
        
        <div style="
            background: rgba(99,102,241,0.1);
            border: 1px solid rgba(99,102,241,0.3);
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
            font-size: 0.8rem;
            color: #aaa;
            text-align: center;
        ">
            ℹ️ Live indicators are previews.<br>
            Full AI analysis runs after you end the interview.
        </div>
      </div>
    </div>

    <!-- Hidden canvas for frame extraction -->
    <canvas id="capture-canvas" style="display: none"></canvas>

    <script src="{{ url_for('static', filename='js/live.js') }}"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Interview | InterviewAI</title>
    <meta
      name="description"
      content="Real-time AI interview analysis using your webcam."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/live.css') }}"
    />
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  </head>
  <body>
    <!-- Notification Toast -->
    <div id="notificationToast" style="
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        display: none;
        flex-direction: column;
        gap: 10px;
        max-width: 320px;
    ">
    </div>

    <nav>
      <a href="{{ url_for('index') }}" class="logo">InterviewAI</a>
      <div class="nav-links">
        <a href="{{ url_for('index') }}"><i class="fas fa-home"></i> Home</a>
      </div>
    </nav>

    <div class="live-container">
      <!-- Left: Video Feed -->
      <div class="video-column">
        <div class="video-wrapper">
          <div class="live-badge" id="live-badge">
            <div class="pulse-dot"></div>
            LIVE
          </div>
          <video id="webcam" autoplay playsinline></video>
          <div id="processingOverlay" class="processing-overlay">
              <div class="spinner"></div>
              <p id="overlayText" class="overlay-text">Preparing upload...</p>
          </div>
        </div>

        <div class="video-controls">
          <div class="timer" id="timer">00:00:00</div>
          
          <!-- Mic Level Indicator -->
          <div style="
              display: flex;
              align-items: center;
              gap: 10px;
              padding: 8px 12px;
              background: rgba(255,255,255,0.05);
              border-radius: 8px;
              margin-top: 8px;
              margin-bottom: 12px;
          ">
              <span style="color:#aaa; font-size:0.8rem;">🎙 Mic</span>
              <div style="
                  flex: 1;
                  height: 6px;
                  background: rgba(255,255,255,0.1);
                  border-radius: 3px;
                  overflow: hidden;
              ">
                  <div id="micLevel" style="
                      height: 100%;
                      width: 0%;
                      background: linear-gradient(90deg, #22c55e, #6366f1);
                      border-radius: 3px;
                      transition: width 0.1s ease;
                  "></div>
              </div>
              <span id="micStatus" style="color:#aaa; font-size:0.75rem;">Ready</span>
          </div>

          <div class="btn-group">
            <button class="btn btn-start" id="start-btn">
              <i class="fas fa-play"></i> Start Interview
            </button>
            <button class="btn btn-end" id="end-btn" disabled>
              <i class="fas fa-stop"></i> End Interview
            </button>
          </div>
        </div>
      </div>

      <!-- Right: Stats Panel -->
      <div class="stats-column">
        <div class="stats-header">
          <h2>Live Analysis</h2>
          <i class="fas fa-microchip purple-icon"></i>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label"><i class="fas fa-eye"></i> Eye Contact</div>
            <div class="stat-value">
              <span id="stat-gaze">Waiting...</span>
              <span class="indicator-dot" id="dot-gaze"></span>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-label">
              <i class="fas fa-smile"></i> Expression
            </div>
            <div class="stat-value" id="stat-emotion">Waiting...</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">
              <i class="fas fa-user-tie"></i> Posture
            </div>
            <div class="stat-value" id="stat-posture">Waiting...</div>
          </div>

          <div>
            <div
              class="stat-label stat-label-flex"
            >
              <span><i class="fas fa-chart-line"></i> Confidence Score</span>
              <span id="score-text">0%</span>
            </div>
            <div class="progress-bar8">
              <div class="score-fill" id="score-fill" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <div class="tips-panel">
          <h4><i class="fas fa-lightbulb"></i> Live Tips</h4>
          <div class="tip-content" id="tip-text">
            Waiting for analysis to start...
          </div>
        </div>
        
        <div class="live-info-note">
            ℹ️ Live indicators are previews.<br>
            Full AI analysis runs after you end the interview.
        </div>
      </div>
    </div>

    <!-- Hidden canvas for frame extraction -->
    <canvas id="capture-canvas" style="display: none"></canvas>

    <script src="{{ url_for('static', filename='js/live.js') }}"></script>
  </body>
</html>
